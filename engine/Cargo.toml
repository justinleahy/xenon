[package]
name = "xenon-engine"
version = "0.1.0"
edition = "2024"
description = "Rust game engine runtime, rendering, and scene primitives."
license = "MIT OR Apache-2.0"
repository = "https://github.com/justinleahy/xenon"
readme = "../README.md"
keywords = ["game-engine", "wgpu", "2d", "runtime"]
categories = ["game-development", "rendering"]

[features]
default = ["assets", "render", "runtime", "scene"]
assets = ["dep:image", "dep:serde", "dep:thiserror", "dep:toml"]
render = ["assets", "dep:bytemuck", "dep:thiserror", "dep:wgpu"]
runtime = ["dep:serde", "dep:thiserror", "dep:toml"]
scene = ["dep:serde"]

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"], optional = true }
image = { version = "0.25.10", optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
thiserror = { version = "2.0.18", optional = true }
toml = { version = "1.1.2", optional = true }
wgpu = { version = "29.0.3", optional = true }
