[package]
name = "xenon-engine"
version = "0.1.0"
edition = "2024"
description = "Rust game engine runtime, rendering, and scene primitives."
license = "MIT OR Apache-2.0"
repository = "https://github.com/justinleahy/xenon"
readme = "../README.md"
keywords = ["game-engine", "wgpu", "2d", "runtime"]
categories = ["game-development", "rendering"]

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
toml = "1.1.2"
tracing = "0.1.44"
wgpu = "29.0.3"
